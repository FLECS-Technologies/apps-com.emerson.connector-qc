services:
  connector_demo:
    image: itaimageregistry.azurecr.io/pacedge/emerson-llama-connector-qc:1.0.1
    user: root
    environment:
      - NEOReadDebugKeys=1
      - OverrideGpuAddressSpace=48
    command:
      # for custom script name replace `python_dispatcher_v2.py` with your script's name
      # "/home/pypacedge/<YOUR_SCRIPT_NAME>.py"
      - "/home/openvino/user_scripts/img_process_loop.py"
    container_name: connector_demo
    restart: always
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /docker_val:/docker_val
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - unix_socket:/unix_socket
      - nodered:/nrimages
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - 993
    #keep container running, even if there is no service to process  
    #not needed if Python app is continuously running
    stdin_open: true
    tty: true
    networks:
      - corenet
    extra_hosts:
    - "host.docker.internal:host-gateway"
    security_opt:
      - "no-new-privileges:true"

  # Run-once init container: deploys Node-RED flows and imports the Grafana dashboard
  # via their APIs, then exits. Admin passwords are read from the host's ansible-vault file.
  provisioner:
    image: itaimageregistry.azurecr.io/pacedge/emerson-llama-connector-qc-provisioner:1.0.1
    container_name: connector_provisioner
    restart: "no"
    environment:
      - NODE_RED_URL=${NODE_RED_URL:-http://emerson-nodered:1880/nodered}
      - GRAFANA_URL=${GRAFANA_URL:-http://emerson-grafana:3000}
      # Admin usernames are fixed; passwords come from the ansible-vault file mounted below.
      - VAULT_FILE=/vault/vault.yml
      - VAULT_PASS_FILE=/vault/.vaultpass
      - VAULT_CRED_KEY=admin
    volumes:
      - ${VAULT_HOST_FILE:-/home/admin/pacedgen/inventory/host_vars/localhost/vault.yml}:/vault/vault.yml:ro
      - ${VAULT_HOST_PASS:-/home/admin/pacedgen/project/.vaultpass}:/vault/.vaultpass:ro
    networks:
      - corenet
    security_opt:
      - "no-new-privileges:true"

networks:
  corenet:
    external: true
#networks:
#  internal:
#    driver_opts:
#      com.docker.network.bridge.name: br-pacedge

volumes:
  unix_socket:
    driver: local
  nodered:
    driver: local
  
